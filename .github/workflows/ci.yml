name: Build APK for Letv X4-50

on:
  push:
  workflow_dispatch:

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Launcher APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-x450-apk
          path: launcher/app/build/outputs/apk/release/*.apk
