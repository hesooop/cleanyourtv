name: Build APK for Letv X4-50

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 官方标准 Gradle Action：自动修复 gradlew 权限并接管缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Launcher APK
        working-directory: launcher
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-x450-apk
          path: launcher/app/build/outputs/apk/release/*.apk
