name: Build Android 6.0 Launcher APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Lower minSdk to 23 for Android 6.0 and Build APK
        working-directory: ./launcher
        run: |
          sed -i 's/minSdk[Version]* [0-9]*/minSdk 23/g' app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-android6-apk
          path: launcher/app/build/outputs/apk/release/*.apk
